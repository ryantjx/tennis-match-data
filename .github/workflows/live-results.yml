name: Daily Open Tennis Data v3 release

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

concurrency:
  group: tennis-v3-release
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install .
      - name: Resolve one immutable parent release
        id: parent
        run: |
          tag=$(gh release list --limit 100 --json tagName,publishedAt \
            --jq '[.[] | select(.tagName | startswith("data-v3-"))] | sort_by(.publishedAt) | last | .tagName')
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          gh release download "$tag" --dir "$RUNNER_TEMP/parent-release"
      - name: Close the active-event source bundle
        run: |
          open-tennis-data collect-live \
            --as-of "$(date -u +%FT%TZ)" \
            --parent-release "${{ steps.parent.outputs.tag }}" \
            --parent-manifest "$RUNNER_TEMP/parent-release/manifest.json" \
            --permission-policy src/open_tennis_data/sources.json \
            --output "$RUNNER_TEMP/live-bundle"
          open-tennis-data validate --data "$RUNNER_TEMP/live-bundle"
      - name: Upload closed-bundle telemetry
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: daily-live-bundle-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/live-bundle/bundle.json
            ${{ runner.temp }}/live-bundle/telemetry.jsonl
            ${{ runner.temp }}/live-bundle/rejections.jsonl
          if-no-files-found: error
